[workspace]
resolver = "2"
members = ["src-tauri", "ui"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"

# `unsafe` is confined to the native host's platform interop (macOS AppKit /
# WebKit through objc2, plus a few libc calls). It is never needed in the UI
# crate. Requiring a SAFETY note on every block keeps those calls reviewable:
# the note must state the actual invariant, not restate the code.
[workspace.lints.clippy]
undocumented_unsafe_blocks = "deny"
multiple_unsafe_ops_per_block = "deny"

[profile.dev]
debug = "limited"

# Opt-in fast WASM development profile. It keeps opt-level="z" (so the module
# stays reasonably small) but drops LTO, which is what makes every edit to the
# release-wasm frontend pay for a full ~20s whole-program link. wasm-opt is also skipped in
# this mode. The default `dev` and `release-wasm` profiles are untouched, so
# `npm run build` still produces the size-optimized frontend.
[profile.dev-wasm]
inherits = "dev"
opt-level = "z"
lto = false
codegen-units = 16
debug = 0
panic = "abort"
incremental = true

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

# The WebAssembly frontend is the largest thing KWork ships. Keep its size
# settings in a separate profile so the native Tauri host stays on opt-level 3
# + thin LTO. `strip = false` preserves the `target_features` custom section:
# wasm-bindgen needs it to detect the Wasm features rustc enabled, and stripping
# it makes wasm-bindgen fall back to MVP assumptions. build-ui.mjs runs wasm-opt
# on the wasm-bindgen output instead, which shrinks far more than strip did.
[profile.release-wasm]
inherits = "release"
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = false

[patch.crates-io]
gpui-pre-web = { path = "vendor/gpui-pre-web" }
gpui-pre-wgpu = { path = "vendor/gpui-pre-wgpu" }
