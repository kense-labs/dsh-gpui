name: Windows build

on:
  workflow_dispatch:
  push:
    # workflow_dispatch requires the workflow on the default branch; push
    # events read the workflow from the pushed ref, so build branches work too.
    branches: [main, 'workbuddy/**']
    paths:
      - 'src-tauri/**'
      - 'ui/**'
      - 'services/**'
      - 'scripts/**'
      - 'shared/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'package.json'
      - '.github/workflows/windows.yml'

jobs:
  build:
    runs-on: windows-latest
    env:
      KWORK_UI_BUILD: always
    steps:
      - uses: actions/checkout@v4

      - name: Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Node.js (bundled Harness runtime)
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install frontend dependencies
        run: bun install --no-save

      - name: Build GPUI/WASM frontend
        run: bun run ui:build

      - name: Verify native host compiles
        run: cargo check -p dsh-gpui

      - name: Build Windows installer (NSIS)
        run: bun x tauri build --bundles nsis

      - name: Upload installer and portable binary
        uses: actions/upload-artifact@v4
        with:
          name: KWork-Windows-x64
          if-no-files-found: error
          path: |
            target/release/KWork.exe
            target/release/bundle/nsis/*.exe
